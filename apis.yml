aid: moda
name: Moda
description: >-
  Moda is a continual-learning and observability layer for AI agents and LLM-native
  software, built by ModaLabs (YC W26, San Francisco). It turns production agent
  traces into validated improvements to the agent harness (prompts, tools, workflows,
  retrieval, memory, evals) rather than the model weights. The platform ingests
  conversations via a lightweight SDK plus OpenTelemetry/OTLP intake, then provides
  intent discovery, behavioral failure detection, tool-call failure taxonomies,
  frustration root-cause attribution, and prompt management. Moda exposes an HTTP
  ingestion API, a read-only Data API for analytics, first-party Python and
  TypeScript SDKs, a CLI, a production MCP server, and Claude Code skills so teams
  and agents can query and act on their agent analytics.
