apis:
- name: Moda Ingestion API
  description: >-
    HTTP ingestion API for sending LLM/agent conversation events to Moda. Accepts
    batched events (conversation_id, role, message, plus token/model/trace metadata)
    over a single POST endpoint, authenticated with a Bearer API key.
  humanURL: https://docs.moda.dev/ingestion/direct-api
  baseURL: https://moda-ingest.modas.workers.dev
  tags:
  - Ingestion
  - Events
  - Observability
