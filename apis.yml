  - type: Authentication
    url: authentication/moda-authentication.yml
  - type: ErrorCatalog
    url: errors/moda-problem-types.yml
- name: Moda Data API
  description: >-
    Read-only analytics API for programmatic access to Moda conversation data:
    overview/KPIs, conversations, world state, topic clusters, frustrations, and
    tool failures. Authenticated with an API key via the x-api-key header or the
    MODA_API_KEY environment variable; wrapped by the Moda CLI and MCP server.
  humanURL: https://docs.moda.dev/data-api/overview
  baseURL: https://moda.dev
